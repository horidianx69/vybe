services:
  api:
    build: ./backend
    init: true
    ports:
      - "3001:3001"
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/vybe
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    attach: false
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

volumes:
  mongo-data:
